# MCP Mesh — Mosquitto Broker Configuration
# Copy to /etc/mosquitto/conf.d/mcp-mesh.conf
# Then: sudo systemctl restart mosquitto

# Listen on all interfaces (LAN)
listener 1883 0.0.0.0

# Require authentication — no anonymous connections
allow_anonymous false
password_file /etc/mosquitto/passwd

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Message limits
max_queued_messages 1000
max_inflight_messages 20

# Session persistence (retained messages survive broker restart)
persistence true
persistence_location /var/lib/mosquitto/

# Expire persistent sessions for devices absent > 1 hour
# (MQTT 5.0 feature — requires broker and client both use MQTT 5)
# persistent_client_expiration 1h
